apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-mcp
  template:
    metadata:
      labels:
        app: kube-mcp
    spec:
      serviceAccountName: sre-agent-sa
      containers:
      - name: mcp-server
        image: local-kube-mcp:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kube-mcp-service
spec:
  selector:
    app: kube-mcp
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080