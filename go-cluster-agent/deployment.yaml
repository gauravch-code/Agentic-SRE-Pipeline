apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent-deployment
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: sre-agent
  template:
    metadata:
      labels:
        app: sre-agent
    spec:
      serviceAccountName: sre-agent-sa 
      containers:
      - name: agent-container
        # THE NEW IMAGE: Using your local compiled image
        image: incluster-agent:latest 
        imagePullPolicy: Never
        resources:
          limits:
            memory: "10Mi"     # deliberately tiny so the pod lives near its ceiling
          requests:
            memory: "8Mi"