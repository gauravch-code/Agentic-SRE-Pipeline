---
# 1. THE ID BADGE (ServiceAccount)
# We are creating a specific identity for your Go agent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-sa
  namespace: default

---
# 2. THE PERMISSIONS (Role)
# We are defining exactly what this badge is allowed to do.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader-role
  namespace: default
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods", "pods/log"]
  verbs: ["get", "watch", "list"] # CRITICAL: Notice we did NOT give it "delete" permission here!-
- apiGroups: ["apps"] # 🚨 NEW: Access to Deployments
  resources: ["deployments"]
  verbs: ["get", "patch", "update"]

---
# 3. THE STAPLER (RoleBinding)
# We are stapling the ID Badge (ServiceAccount) to the Permissions (Role).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: sre-agent-sa
  namespace: default
roleRef:
  kind: Role
  name: pod-reader-role
  apiGroup: rbac.authorization.k8s.io